const NO_ART = `<div class="wait"><small>No picture for this scene</small></div>`;
/* ============ GROWN-UPS AREA ============ */
/* Children read; grown-ups set books up and see how the reading went. The two are kept apart by a small sum. */
let reports = [];
try { const saved = JSON.parse(localStorage.getItem("storyforge_reports") || "[]"); if (Array.isArray(saved)) reports = saved.slice(0, 20); } catch(e) {}
function saveReport(){
  if (!S || !S.report || S.report.error || S.reportSaved) return;
  S.reportSaved = true;
  reports.unshift({title: S.title, child: S.settings.child_name, when: new Date().toLocaleDateString(undefined, {month: "short", day: "numeric"}), words: S.wordsRead, report: S.report});
  reports = reports.slice(0, 20);
  try { localStorage.setItem("storyforge_reports", JSON.stringify(reports)); } catch(e) {}
}
let gate = null;
function gateView(){
  if (!gate) gate = {a: 3 + Math.floor(Math.random() * 6), b: 3 + Math.floor(Math.random() * 6), wrong: false};
  return `<div class="view">${bar("Grown-ups", true)}
  <div class="card stack"><h2>For grown-ups</h2><p class="sub">Children, ask a grown-up to help with this one.</p>
    <p class="question">What is ${gate.a} × ${gate.b}?</p>
    <div class="own"><input id="gateIn" inputmode="numeric" autocomplete="off" placeholder="Type the answer"><button type="button" class="btn" id="gateGo">Open</button></div>
    ${gate.wrong ? `<p class="sub">That is not it. Try again.</p>` : ""}</div></div>`;
}
function reportCard(e){
  const r = e.report || {}, mark = v => v === true ? "✔ Right" : v === false ? "Not yet" : "Skipped";
  return `<div class="card stack"><div><span class="next-label">${esc(e.when || "")}</span><h2 style="font-size:24px">${esc(e.child)} read “${esc(e.title)}”</h2></div>
    <p style="max-width:66ch">${esc(r.summary || "")}</p>
    <div class="report">
      <div class="stat"><div class="n">${mark(r.after_correct)}</div><div class="l">Question after the story</div></div>
      <div class="stat"><div class="n">${esc(r.wise_choices ?? "–")} of ${esc(r.total_choices ?? "–")}</div><div class="l">Wise choices</div></div>
      <div class="stat"><div class="n">${esc(e.words ?? 0)}</div><div class="l">Words read</div></div>
    </div>
    ${r.child_quote ? `<p class="quote">“${esc(r.child_quote)}”<br><span class="hint">${esc(e.child)}, in a think-back moment</span></p>` : ""}
    ${Array.isArray(r.highlights) && r.highlights.length ? `<ul>${r.highlights.map(h => `<li>${esc(h)}</li>`).join("")}</ul>` : ""}
    ${r.conversation_starter ? `<div class="think"><h3>Ask tonight</h3><p style="margin:0">${esc(r.conversation_starter)}</p></div>` : ""}</div>`;
}
function parentsView(){
  return `<div class="view">${bar("Grown-ups", true)}
  <div class="card stack"><h2>Make a book about your child</h2><p class="sub">Their name, what they love, the lesson you choose and the limits you set. The book is written before it opens, so there is no waiting while they read.</p>
    <div class="tools"><button type="button" class="btn" id="goCustom">Make a book</button></div></div>
  <h2 style="margin:6px 0 0">Reading reports</h2>
  ${reports.length ? reports.map(reportCard).join("") : `<div class="card"><p class="sub">No reports yet. One appears here each time your child finishes a book.</p></div>`}
  </div>`;
}

function homeView(){
  return `<div class="view">${bar("My bookshelf")}
  <div class="shelf">${LIBRARY.map((l,i) => `<button type="button" class="cover" data-lib="${i}" aria-label="${esc(l.title)}">
      <img src="${COVER_IMG[i] || ""}" alt="">
      <span class="cover-title">${esc(l.title)}<small>${esc(l.lessonLabel.replace(" · ", ": "))}</small></span>
      ${stars.books[i] ? `<span class="sticker" role="img" aria-label="Finished"><i class="star"></i></span>` : ""}
    </button>`).join("")}</div>
  <div class="plank"></div>
  <div class="shelf two">
    <button type="button" class="cover blank" id="goParents"><span class="plus" aria-hidden="true">+</span><b>Grown-ups</b><small>Make a book, see reports</small></button>
    <div class="quick">
      <h2>Surprise book</h2>
      <div class="seg" role="group" aria-label="Subject">${SUBJECTS.map(s => `<button type="button" data-quick="${s[0]}" aria-pressed="${quick.subject === s[0]}">${s[1]}</button>`).join("")}</div>
      <div class="quick-row">
        <label for="q_age">Age</label>
        <select id="q_age">${[4,5,6,7,8,9,10,11,12].map(a => `<option ${quick.age === a ? "selected" : ""}>${a}</option>`).join("")}</select>
        <input id="q_name" placeholder="Your name" value="${esc(quick.name)}">
        <button type="button" class="btn go ico-play" id="quickGo">Start reading</button>
      </div>
    </div>
  </div>
  <div class="plank"></div>
  </div>`;
}
function setupView(){
  const d = draft;
  const seg = (name, vals) => `<div class="seg" role="group">${vals.map(v => `<button type="button" data-seg="${name}" data-val="${v[0]}" aria-pressed="${d[name] === v[0]}">${v[1]}</button>`).join("")}</div>`;
  return `<div class="view">${bar("Make a book", true)}<div class="card">
    <h2 style="font-size:30px">Tell us about your child</h2>
    <p class="sub" style="margin:6px 0 20px">You know what keeps them hooked. We'll turn it into a story that teaches.</p>
    <form id="setupForm" class="form">
      <div class="field"><label for="f_name">Child's first name</label><input id="f_name" value="${esc(d.child_name)}" required></div>
      <div class="field"><label for="f_age">Age</label><input id="f_age" type="number" min="3" max="12" value="${esc(d.child_age)}"></div>
      <div class="field full"><label for="f_int">Interests and favorite things</label><span class="hint">Pets, hobbies, favorite foods, people they love… The more specific, the better.</span><textarea id="f_int">${esc(d.interests)}</textarea></div>
      <div class="field"><label for="f_type">What kind of lesson?</label><select id="f_type">${[["math","Math"],["geography","Geography"],["science","Science"],["moral","Values and kindness"],["reading","Reading and words"]].map(o => `<option value="${o[0]}" ${d.lesson_type === o[0] ? "selected" : ""}>${o[1]}</option>`).join("")}</select></div>
      <div class="field"><label for="f_read">Reading level</label><select id="f_read">${["pre-reader (listens only)","early reader","confident reader"].map(o => `<option ${d.reading_level === o ? "selected" : ""}>${o}</option>`).join("")}</select></div>
      <div class="field full"><label for="f_lesson">What should they learn?</label><span class="hint">Not sure? Press "Suggest a lesson" and the AI picks one for the subject and age.</span>
        <div class="row"><input id="f_lesson" value="${esc(d.lesson)}" placeholder="e.g. adding numbers up to 20, sharing with friends" style="flex:1;min-width:220px"><button type="button" class="btn secondary ico-spark" id="suggestLesson" ${d._suggesting ? "disabled" : ""}>${d._suggesting ? "Thinking…" : "Suggest a lesson"}</button></div></div>
      <div class="field full"><label for="f_theme">Story idea (optional)</label><input id="f_theme" value="${esc(d.theme)}" placeholder="Leave empty and we'll build one from the interests"></div>
      <div class="field full"><label for="f_lim">Limits: what should the story avoid?</label><input id="f_lim" value="${esc(d.limits)}" placeholder="e.g. no scary monsters, no fighting"></div>
      <div class="field full"><label>How strong should consequences be?</label><span class="hint">Weaker choices lead to setbacks in the story, so kids learn from them.</span>${seg("consequence_level", [["gentle","Gentle"],["medium","Medium"],["real","Real"]])}</div>
      <div class="field full row"><button type="submit" class="btn go">Write the book</button><button type="button" class="btn secondary" id="backHome">Back</button></div>
    </form>
  </div></div>`;
}
function warmupView(){ // the loading screen while the first chapter is written
  if (S.error) return errorCard();
  if (!S.busy && S.scenes.length) { screen = "story"; return storyView(); }
  return `<div class="view">${bar("One moment", true)}<div class="card"><div class="wait" style="padding:48px 0"><span class="blobs"><i></i><i></i><i></i></span><span style="font-size:26px">Writing ${esc(S.settings.child_name)}'s book</span><small>The story agents are busy. Tap the chip at the top to watch them.</small></div></div></div>`;
}
function errorCard(){ return `<div class="view">${bar("Oops", true)}<div class="card stack"><div class="conseq">${esc(S.error)}</div><div class="tools"><button type="button" class="btn" id="retry">Try again</button><button type="button" class="btn secondary" id="backHome">Bookshelf</button></div></div></div>`; }
/* A chapter is read as pages: a title page (first chapter only), what happened after the last choice (if any), then the text two sentences at a time. */
function pagesOf(sc){
  if (!sc._pages) {
    const sents = (String(sc.scene_text || "").match(/[^.!?]+[.!?]+["”’']*|[^.!?]+$/g) || []).map(x => x.trim()).filter(Boolean);
    const per = Math.max(1, Math.ceil(sents.length / 3));
    const pages = [];
    for (let i = 0; i < sents.length; i += per) pages.push({text: sents.slice(i, i + per).join(" ")});
    if (!pages.length) pages.push({text: String(sc.scene_text || "")});
    pages[0].first = true;
    const front = [];
    if (S.scenes[0] === sc) front.push({text: `${S.title}. A book for ${S.settings.child_name}.`, cover: true});
    if (sc.consequence_text) front.push({text: sc.consequence_text, cons: true});
    sc._pages = front.concat(pages);
  }
  return sc._pages;
}
/* Read-along: every word on the page can be tapped, and lights up while the page is read aloud. */
const RA = {playing: false, idx: 0};
function wordsHTML(text){ return String(text).split(/\s+/).filter(Boolean).map(w => `<span class="w">${esc(w)}</span>`).join(" "); }
function pageWordEls(){ return [...document.querySelectorAll(".leaf-text .readtext .w")]; }
function markWord(i){ pageWordEls().forEach((el, k) => el.classList.toggle("now", k === i)); }
function setPlayUI(){ const b = $("readToggle"); if (b) { b.classList.toggle("playing", RA.playing); b.setAttribute("aria-label", RA.playing ? "Pause reading" : "Read to me"); } }
function readFrom(i, force){
  const els = pageWordEls();
  if (!els.length) { // title page, choices, think-back: read it plainly
    const sc = currentScene(), pages = pagesOf(sc);
    const text = S.think ? "If you could choose again, what would you do differently?"
      : S.page < pages.length ? pages[S.page].text
      : [sc.question || "What do you do?"].concat(sc.options.map((o, k) => "ABCD"[k] + ". " + o.label)).join(" ");
    RA.playing = !muted || !!force; setPlayUI();
    speak(text, {onEnd: () => { RA.playing = false; setPlayUI(); }}, force);
    return;
  }
  if (muted && !force) { RA.playing = false; setPlayUI(); return; }
  if (i >= els.length || i < 0) i = 0;
  RA.playing = true; RA.idx = i; setPlayUI();
  speak(els.slice(i).map(e => e.textContent).join(" "), {
    onWord: k => { RA.idx = i + k; markWord(RA.idx); },
    onEnd: natural => { RA.playing = false; if (natural) { RA.idx = 0; markWord(-1); } setPlayUI(); }
  }, true);
}
function pauseRead(){ RA.playing = false; stopSpeak(); setPlayUI(); }
function tapWord(el){
  pauseRead();
  const els = pageWordEls(); RA.idx = Math.max(0, els.indexOf(el)); markWord(RA.idx);
  el.classList.remove("hit"); void el.offsetWidth; el.classList.add("hit");
  const word = el.textContent.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, "");
  if (!word) return;
  const b = getBrowserVoice(); // the browser voice answers at once, which is what a tapped word needs
  if (b) b.speak(word, {rate: 0.85}); else speak(word, null, true);
}
function speakPage(force){ if (!currentScene() || screen !== "story") return; RA.idx = 0; readFrom(0, force); }
function goEnding(){ stopSpeak(); awardStar(); screen = "ending"; render(); confetti(); if (S.warmup) speak("You finished the book! You earned a star."); }
function storyView(){
  const sc = currentScene();
  const n = S.scenes.length;
  const pages = pagesOf(sc);
  const atChoice = S.page >= pages.length;
  const idle = !S.error && !S.busy && !S.think;
  const art = `<div class="art" data-art="${n-1}">${pagePaint(sc) ? `<img class="paint" src="${esc(pagePaint(sc))}" alt="">` : pageSpec(sc) ? "" : sc.svg || (sc.noArt ? NO_ART : `<div class="wait"><span class="blobs"><i></i><i></i><i></i></span><small>The Illustrator is drawing…</small></div>`)}</div>`;
  let side;
  if (S.error) side = `<div class="conseq">${esc(S.error)}</div><div class="tools"><button type="button" class="btn" id="retry">Try again</button></div>`;
  else if (S.busy) side = `<div class="wait" style="margin:auto"><span class="blobs"><i></i><i></i><i></i></span><span>Writing what happens next</span></div>`;
  else if (S.think) {
    const t = S.think;
    side = `${sc.consequence_text ? `<p class="readtext" style="font-size:24px">${wordsHTML(sc.consequence_text)}</p>` : ""}
      <div class="think"><h3>Think-back moment</h3><p>If you could choose again, what would you do differently?</p>
      ${t.reply ? `<div class="coach"><span class="who">The Coach says</span>${esc(t.reply)}</div><div class="tools"><button type="button" class="btn mint" id="thinkDone">Keep reading</button></div>`
        : t.busy ? `<div class="writing"><div class="spin"></div>The Coach is listening…</div>`
        : `<div class="own"><input id="thinkIn" placeholder="Say it or type it">${micButton("thinkIn")}<button type="button" class="btn" id="thinkGo">Tell the Coach</button></div>`}</div>`;
  }
  else if (!atChoice) {
    const pg = pages[S.page];
    side = pg.cover
      ? `<div class="titlepage"><h1>${esc(S.title)}</h1><p>A book for ${esc(S.settings.child_name)}</p></div>`
      : `${pg.cons ? `<span class="next-label">What happened next</span>` : ""}<p class="readtext">${wordsHTML(pg.text)}</p>`;
  }
  else side = `<p class="question">${esc(sc.question || "What do you do?")}</p>
    <div class="opts">${sc.options.map((o,i) => `<button type="button" class="opt o${i}" data-opt="${i}"><span class="k" aria-hidden="true">${"ABCD"[i]}</span><span>${esc(o.label)}</span></button>`).join("")}</div>
    <div class="own"><input id="ownIn" placeholder="Or tell your own idea">${micButton("ownIn")}<button type="button" class="btn secondary" id="ownGo">Try my idea</button></div>
    ${!S.rewindUsed && S.choices.length ? `<div class="tools"><button type="button" class="btn secondary ico-rewind" id="rewind">Rewind one choice</button></div>` : ""}`;
  const canTurn = idle && !atChoice;
  const last = S.page === pages.length - 1;
  const nextLabel = !canTurn ? "" : pages[S.page].cover ? "Start" : last ? (sc.is_ending ? "The end" : "Your turn") : "Next";
  const dots = pages.map((_, i) => `<i class="${i < S.page ? "done" : i === S.page ? "on" : ""}"></i>`).join("") + (sc.is_ending ? "" : `<i class="pick ${atChoice ? "on" : ""}"></i>`);
  const turned = turnDir > 0 ? "turn-next" : turnDir < 0 ? "turn-back" : "";
  return `<div class="view reader">
    ${bar(S.title, true)}
    <div class="spread"><div class="leaf leaf-text ${turned}">${side}</div><div class="leaf leaf-art">${art}</div></div>
    <div class="dock">
      <button type="button" class="turn back" id="pageBack" aria-label="Previous page" ${!idle || S.page === 0 ? "disabled" : ""}><span class="arr"></span></button>
      <div class="dock-mid">
        ${canSpeak() ? `<div class="readbar"><button type="button" class="playbtn" id="readToggle" aria-label="Read to me"></button><span>Read to me</span></div>` : ""}
        <div class="pdots" role="img" aria-label="Page ${Math.min(S.page + 1, pages.length)} of ${pages.length}, chapter ${n} of ${TOTAL}">${dots}</div>
      </div>
      ${canTurn ? `<button type="button" class="turn" id="pageNext">${nextLabel}<span class="arr"></span></button>` : `<span class="turn-gap"></span>`}
    </div>
  </div>`;
}
function endingView(){
  const cols = S.choices.map((c, i) => {
    const opts = c.custom ? [...c.options, {label: c.label, hidden_type: c.hidden_type, leads_to: "The hero's own idea!", _own: true}] : c.options;
    return `<div class="col"><h3>Choice ${i+1}</h3>${opts.map(o => {
      const chosen = o._own || (!c.custom && o.label === c.label);
      return `<div class="node ${chosen ? "chosen" : ""}"><b>${chosen ? "✔ " : ""}${esc(o.label)}</b>${esc(o.leads_to || "")}<br><span class="badge b-${esc(o.hidden_type)}">${esc(TYPE_LABEL[o.hidden_type] || "")}</span></div>`;
    }).join("")}</div>`;
  }).join("");
  let warm = "";
  if (S.warmup && !S.report && !S.reportBusy) warm = `<div class="card stack"><span class="next-label">One question about the story</span><p class="question">${esc(S.warmup.question)}</p>
    <div class="own"><input id="afterIn" placeholder="Say it or type it…">${micButton("afterIn")}<button type="button" class="btn" id="afterGo">Done</button></div></div>`;
  else if (!S.warmup && !S.report && !S.reportBusy) warm = `<div class="tools"><button type="button" class="btn" id="afterGo">Done</button></div>`;
  let rep = "";
  if (S.reportBusy) rep = `<div class="card"><div class="writing"><div class="spin"></div>The Reflector is writing the report for your grown-up…</div></div>`;
  else if (S.report && S.report.error) rep = `<div class="card"><div class="conseq">${esc(S.report.error)}</div><div class="tools"><button type="button" class="btn" id="afterGo">Try again</button></div></div>`;
  else if (S.report) {
    saveReport();
    rep = `<div class="card stack"><h2 style="font-size:28px">Great reading, ${esc(S.settings.child_name)}!</h2>
      <p class="sub">You read ${S.wordsRead} words. Your report is saved for your grown-up.</p>
      <div class="tools"><button type="button" class="btn" id="again">Read it again</button><button type="button" class="btn secondary" id="backHome">Bookshelf</button><button type="button" class="btn secondary" id="goParents">Grown-ups: see the report</button></div></div>`;
  }
  return `<div class="view">${bar("The end", true)}
  <div class="party"><div class="bigstar"><i class="star"></i></div><h2>You finished the book!</h2><p>You earned a star for your shelf.</p>
    <div class="tools" style="justify-content:center"><button type="button" class="btn secondary" id="backHome">Back to the bookshelf</button></div></div>
  <div class="card stack"><h2 style="font-size:30px">The roads not taken</h2><p class="sub">Your path is outlined in blue. The grey cards show where the other choices would have led.</p><div class="map">${cols}</div></div>${warm}${rep}</div>`;
}

/* ============ EVENTS ============ */
document.addEventListener("click", e => {
  const w = e.target.closest(".w"); if (w) { tapWord(w); return; }
  const t = e.target.closest("button"); if (!t) { $("crew").classList.remove("open"); return; }
  if (t.dataset.lib !== undefined) { const l = LIBRARY[+t.dataset.lib]; if (l.demo) startDemo(l.demo, {...l.settings, _lib: +t.dataset.lib}); else startStory({...l.settings, _lib: +t.dataset.lib}); return; }
  if (t.dataset.seg) { readForm(); draft[t.dataset.seg] = t.dataset.val; render(); return; }
  if (t.dataset.quick) { readQuick(); quick.subject = t.dataset.quick; render(); return; }
  if (t.dataset.opt !== undefined) { choose(currentScene().options[+t.dataset.opt]); return; }
  if (t.dataset.mic) {
    const target = t.dataset.mic;
    const after = { warmIn: v => { $("warmIn").value = v; }, ownIn: v => { interpret(v); }, thinkIn: v => { coach(v); }, afterIn: v => { $("afterIn").value = v; } }[target];
    startMic(target, after); return;
  }
  switch (t.id) {
    case "goParents": gate = null; stopSpeak(); screen = "gate"; render(); break;
    case "gateGo": { const v = parseInt(($("gateIn").value || "").trim(), 10); if (gate && v === gate.a * gate.b) { gate = null; screen = "parents"; } else if (gate) gate.wrong = true; render(); break; }
    case "quickGo": {
      readQuick();
      startStory({child_name: quick.name || "Kai", child_age: quick.age, reading_level: quick.age <= 6 ? "early reader" : "confident reader",
        interests: "", theme: "", lesson_type: quick.subject, lesson: "", limits: "nothing scary, no fighting", consequence_level: "medium"});
      break;
    }
    case "suggestLesson": suggestLesson(); break;
    case "goCustom": draft = draft || {...LIBRARY[0].settings, child_name:"", interests:"", lesson:"", limits:"", theme:""}; screen = "setup"; render(); break;
    case "backHome": case "homeBtn": stopSpeak(); $("crew").classList.remove("open"); screen = "home"; render(); break;
    case "muteBtn": muted = !muted; if (muted) pauseRead(); t.textContent = muted ? "Sound off" : "Sound on"; t.setAttribute("aria-pressed", !muted); break;
    case "warmGo": S.warmBefore = ($("warmIn").value || "").trim(); screen = "story"; S.page = 0; render(); speakPage(); break;
    case "ownGo": { const v = ($("ownIn").value || "").trim(); if (v) interpret(v); break; }
    case "thinkGo": { const v = ($("thinkIn").value || "").trim(); if (v) coach(v); break; }
    case "thinkDone": finishThink(); break;
    case "readToggle": if (RA.playing) pauseRead(); else readFrom(RA.idx, true); break;
    case "pageNext": {
      const sc = currentScene(), pages = pagesOf(sc), pg = pages[S.page];
      if (pg && !pg.read && !pg.cover) { pg.read = true; S.wordsRead += pg.text.split(/\s+/).filter(Boolean).length; }
      if (sc.is_ending && S.page >= pages.length - 1) { goEnding(); break; }
      S.page++; turnDir = 1; render(); speakPage(); break;
    }
    case "pageBack": if (S.page > 0) { S.page--; turnDir = -1; render(); speakPage(); } break;
    case "rewind": rewind(); break;
    case "crewToggle": { const open = $("crew").classList.toggle("open"); t.setAttribute("aria-expanded", open); break; }
    case "toEnding": goEnding(); break;
    case "afterGo": { const el = $("afterIn"); if (el) S.warmAfter = (el.value || "").trim(); makeReport(); break; }
    case "again": if (S.demo) startDemo(S.demo.key, {...S.settings}); else startStory({...S.settings}); break;
    case "retry":
      if (!S.scenes.length) { const st = S.settings; startStory(st); }
      else { S.error = null; const last = S.choices[S.choices.length - 1]; if (S.scenes.length === S.choices.length) { S.choices.pop(); S.snapshots.pop(); render(); choose(last); } else render(); }
      break;
  }
});
function readForm(){
  if (!$("f_name")) return;
  draft = {...draft,
    child_name: $("f_name").value.trim(), child_age: +$("f_age").value || 7, interests: $("f_int").value.trim(),
    lesson_type: $("f_type").value, reading_level: $("f_read").value, lesson: $("f_lesson").value.trim(),
    theme: $("f_theme").value.trim(), limits: $("f_lim").value.trim()};
}
function readQuick(){
  if ($("q_age")) quick.age = +$("q_age").value || 7;
  if ($("q_name")) quick.name = $("q_name").value.trim();
}
async function suggestLesson(){
  readForm();
  draft._suggesting = true; render();
  const subj = (SUBJECTS.find(s => s[0] === draft.lesson_type) || ["", draft.lesson_type])[1];
  try {
    const r = await ai(`You help a parent set up an educational story game. Subject: ${subj}. Child age: ${draft.child_age}. Child's interests: ${draft.interests || "not given"}.
Suggest ONE specific, age-appropriate lesson that works well inside a story with choices, and a fun story idea that uses the child's interests.
Return ONLY JSON: {"lesson": "short specific lesson, max 12 words", "theme": "one-sentence story idea"}`, "quick");
    if (r.lesson) draft.lesson = r.lesson;
    if (r.theme && !draft.theme) draft.theme = r.theme;
  } catch(e) { showBanner(aiError(e), true); }
  draft._suggesting = false; render();
}
document.addEventListener("submit", e => {
  if (e.target.id !== "setupForm") return;
  e.preventDefault();
  readForm();
  const s = {...draft};
  delete s._suggesting;
  s.child_name = s.child_name || "Alex";
  startStory(s);
});
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" || !e.target.id) return;
  const map = {warmIn:"warmGo", ownIn:"ownGo", thinkIn:"thinkGo", afterIn:"afterGo", gateIn:"gateGo"};
  if (map[e.target.id]) { e.preventDefault(); $(map[e.target.id]).click(); }
});

/* the warm-up screen waits for scene 1; show the story button state when it arrives */
render();
loadCaps();
</script>
</body>
</html>
